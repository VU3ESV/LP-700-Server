name: Release

# Tag-triggered: pushing a tag like `v1.0.0` cross-compiles binaries for
# every supported platform and publishes a GitHub Release with the
# binaries attached and changelog auto-generated from commits since the
# previous tag.
#
# Manual dispatch is also supported (Actions tab → Release → Run
# workflow), in case you want to ship a tag that's already been pushed,
# or you want to re-cut the artifacts after a pipeline fix.
#
# Pure-Go build: HID is implemented via /dev/hidraw on Linux, so no
# CGO / cross-toolchain is needed. Single ubuntu-latest runner cross-
# compiles every target.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (must already exist, e.g. v1.0.0). Leave blank to use the tag that triggered the run.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like vX.Y.Z (got: $VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
          LDFLAGS: '-s -w'
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=linux   GOARCH=amd64           go build -trimpath -ldflags="$LDFLAGS" -o dist/lp700-server-linux-amd64 .
          GOOS=linux   GOARCH=arm64           go build -trimpath -ldflags="$LDFLAGS" -o dist/lp700-server-linux-arm64 .
          GOOS=linux   GOARCH=arm   GOARM=7   go build -trimpath -ldflags="$LDFLAGS" -o dist/lp700-server-linux-armv7 .
          GOOS=darwin  GOARCH=amd64           go build -trimpath -ldflags="$LDFLAGS" -o dist/lp700-server-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64           go build -trimpath -ldflags="$LDFLAGS" -o dist/lp700-server-darwin-arm64 .
          GOOS=windows GOARCH=amd64           go build -trimpath -ldflags="$LDFLAGS" -o dist/lp700-server-windows-amd64.exe .
          (cd dist && sha256sum lp700-server-* > SHA256SUMS)
          ls -la dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" \
              --target "${{ github.sha }}" \
              --title "$VERSION" \
              --generate-notes \
              dist/*
          fi
